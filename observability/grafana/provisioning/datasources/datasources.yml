apiVersion: 1

# Trong file provisioning, "$" phải viết "$$" (nếu không Grafana hiểu là biến môi trường)
datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 5000
      # Log → trace: bấm traceId trong dòng log để mở trace trên Jaeger
      derivedFields:
        - name: traceId
          datasourceUid: jaeger
          # traceId là structured metadata do Alloy gắn → match theo label
          matcherType: label
          matcherRegex: traceId
          url: '$${__value.raw}'
          urlDisplayLabel: Xem trace (Jaeger)

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # Trace → log: từ một span, mở các dòng log cùng traceId trên Loki
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        customQuery: true
        query: '{job="bank"} | traceId="$${__trace.traceId}"'
