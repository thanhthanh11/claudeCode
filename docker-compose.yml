# Hạ tầng cho môi trường dev local: Redis + Kafka (KRaft, không cần Zookeeper) + Jaeger (tracing)
# + Loki/Alloy/Grafana (log tập trung, liên kết log ↔ trace theo traceId) + Mailpit (SMTP dev).
# Oracle chạy riêng (localhost:1521/orcl) — xem CLAUDE.md.
#   docker compose up -d
services:
  redis:
    image: redis:7.4-alpine
    container_name: bank-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: bank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data

  # SMTP giả lập cho notification-service (email gửi tới đây, không ra ngoài). Xem email: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: bank-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Nhận trace qua OTLP HTTP (4318), giao diện xem trace: http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: bank-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ---- Log tập trung: service ghi JSON → Alloy → Loki → Grafana (liên kết trace sang Jaeger) ----
  loki:
    image: grafana/loki:3.2.1
    container_name: bank-loki
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  # Đọc file logs/json/*.json của các service (service chạy trên máy host). UI debug: http://localhost:12345
  alloy:
    image: grafana/alloy:v1.4.3
    container_name: bank-alloy
    ports:
      - "12345:12345"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - .:/bank:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  # Giao diện xem log + trace: http://localhost:3000 (admin / admin)
  grafana:
    image: grafana/grafana:11.3.0
    container_name: bank-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - jaeger

volumes:
  redis-data:
  kafka-data:
  loki-data:
  alloy-data:
  grafana-data:
